<!doctype html>
<!--
  3D device mockups for the featured projects, rendered as transparent PNG stills by render.py.
  Query: ?id=jagapadi|aromasys|skyopt|siews|soc   Screens and logos come from ./projects.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100% !important; height: 100% !important; }
</style>
</head>
<body>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
</script>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const ID = new URLSearchParams(location.search).get("id") || "jagapadi";
const W = innerWidth, H = innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);

const hemi = new THREE.HemisphereLight(0xfff6ea, 0x8a8090, 0.6);
const key = new THREE.DirectionalLight(0xfff1e0, 2.2);
key.position.set(4, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
key.shadow.radius = 6; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(hemi, key);

// Soft shadow on an invisible floor so the PNG stays transparent.
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
scene.add(floor);

// ---------- helpers ----------
const loader = new THREE.TextureLoader();
const load = (src) => new Promise((ok, fail) => loader.load(src, (t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; ok(t); }, undefined, fail));
const metal = (color, rough = 0.35, m = 0.85) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: m });
const SHELL = metal(0x4b4a55, 0.38, 0.8);
const SHELL_DARK = metal(0x1c1b22, 0.5, 0.4);
function cast(obj) { obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return obj; }
function screenMaterial(tex) { return new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }); }

// Crop a texture (via repeat/offset) so it fills the given aspect without stretching.
function cover(tex, aspect) {
  const img = tex.image, a = img.width / img.height;
  tex.repeat.set(1, 1); tex.offset.set(0, 0);
  if (a > aspect) { tex.repeat.x = aspect / a; } // keep the left edge, where page titles sit
  else { tex.repeat.y = a / aspect; tex.offset.y = 1 - tex.repeat.y; } // keep the top of the page
  return tex;
}

function keyboardTexture() {
  const c = document.createElement("canvas"); c.width = 1024; c.height = 400;
  const g = c.getContext("2d");
  g.fillStyle = "#2a2930"; g.fillRect(0, 0, c.width, c.height);
  const rows = [14, 14, 13, 12, 10], kw = 64, gap = 8;
  rows.forEach((n, r) => {
    const total = n * kw + (n - 1) * gap, x0 = (c.width - total) / 2;
    for (let i = 0; i < n; i++) {
      const w = r === 4 && i === 4 ? kw * 3 + gap * 2 : kw;
      if (r === 4 && i > 4 && i < 7) continue;
      g.fillStyle = "#121116";
      g.beginPath(); g.roundRect(x0 + i * (kw + gap), 18 + r * (kw + gap), w, kw, 8); g.fill();
    }
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function laptop(tex) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new RoundedBoxGeometry(4.2, 0.14, 2.9, 4, 0.06), SHELL);
  base.position.y = 0.07; g.add(base);
  const deck = new THREE.Mesh(new THREE.PlaneGeometry(3.7, 1.45), new THREE.MeshStandardMaterial({ map: keyboardTexture(), roughness: 0.7 }));
  deck.rotation.x = -Math.PI / 2; deck.position.set(0, 0.142, -0.42); g.add(deck);
  const pad = new THREE.Mesh(new RoundedBoxGeometry(1.4, 0.01, 0.85, 2, 0.004), metal(0x5a5964, 0.25, 0.7));
  pad.position.set(0, 0.142, 0.88); g.add(pad);
  const hinge = new THREE.Group(); hinge.position.set(0, 0.14, -1.42); hinge.rotation.x = -0.22; g.add(hinge);
  const lid = new THREE.Mesh(new RoundedBoxGeometry(4.2, 2.72, 0.1, 4, 0.05), SHELL);
  lid.position.set(0, 1.36, 0); hinge.add(lid);
  const bezel = new THREE.Mesh(new THREE.PlaneGeometry(4.08, 2.6), new THREE.MeshStandardMaterial({ color: 0x0b0b0e, roughness: 0.2, metalness: 0.2 }));
  bezel.position.set(0, 1.36, 0.052); hinge.add(bezel);
  const sw = 3.84, sh = sw / 1.6;
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), screenMaterial(cover(tex, 1.6)));
  screen.position.set(0, 1.4, 0.054); hinge.add(screen);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(4.08, 2.6), new THREE.MeshPhysicalMaterial({ transparent: true, opacity: 0.08, roughness: 0.05, metalness: 0, clearcoat: 1 }));
  glass.position.set(0, 1.36, 0.056); hinge.add(glass);
  return cast(g);
}

function phone(tex) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.2, 2.5, 0.11, 6, 0.05), SHELL_DARK);
  g.add(body);
  const sw = 1.1, sh = 2.4;
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), screenMaterial(cover(tex, sw / sh)));
  screen.position.z = 0.057; g.add(screen);
  const lens = new THREE.Mesh(new THREE.CircleGeometry(0.03, 20), new THREE.MeshBasicMaterial({ color: 0x050505 }));
  lens.position.set(0, 1.14, 0.059); g.add(lens);
  return cast(g);
}

function monitor(tex, aspect) {
  const g = new THREE.Group();
  const foot = new THREE.Mesh(new RoundedBoxGeometry(1.6, 0.08, 1.0, 4, 0.04), SHELL); foot.position.y = 0.04; g.add(foot);
  const neck = new THREE.Mesh(new RoundedBoxGeometry(0.28, 1.2, 0.12, 4, 0.05), SHELL); neck.position.set(0, 0.62, -0.2); neck.rotation.x = -0.12; g.add(neck);
  const sw = 4.0, sh = sw / aspect;
  const body = new THREE.Mesh(new RoundedBoxGeometry(sw + 0.22, sh + 0.22, 0.14, 4, 0.06), SHELL_DARK);
  body.position.set(0, 1.25 + sh / 2, -0.12); g.add(body);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), screenMaterial(cover(tex, aspect)));
  screen.position.set(0, 1.25 + sh / 2, -0.048); g.add(screen);
  return cast(g);
}

// A floating app window: rounded corners, title bar with traffic lights, then the screenshot.
function windowPanel(tex, width, title, dark = false) {
  const img = tex.image, bar = 46, pad = 0;
  const cw = 1200, ch = Math.round(cw * img.height / img.width) + bar;
  const c = document.createElement("canvas"); c.width = cw; c.height = ch;
  const g = c.getContext("2d");
  g.beginPath(); g.roundRect(0, 0, cw, ch, 26); g.clip();
  g.fillStyle = dark ? "#1b1a22" : "#f4f1ec"; g.fillRect(0, 0, cw, bar);
  ["#ff5f57", "#febc2e", "#28c840"].forEach((col, i) => { g.fillStyle = col; g.beginPath(); g.arc(30 + i * 26, bar / 2, 8, 0, Math.PI * 2); g.fill(); });
  g.fillStyle = dark ? "#9b97a8" : "#6b6276"; g.font = "600 20px system-ui, sans-serif"; g.textAlign = "center"; g.fillText(title, cw / 2, bar / 2 + 7);
  g.drawImage(img, pad, bar, cw, ch - bar);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const h = width * ch / cw;
  const grp = new THREE.Group();
  const shape = new THREE.Shape(); const r = 0.12;
  shape.moveTo(-width / 2 + r, -h / 2); shape.lineTo(width / 2 - r, -h / 2); shape.quadraticCurveTo(width / 2, -h / 2, width / 2, -h / 2 + r);
  shape.lineTo(width / 2, h / 2 - r); shape.quadraticCurveTo(width / 2, h / 2, width / 2 - r, h / 2); shape.lineTo(-width / 2 + r, h / 2);
  shape.quadraticCurveTo(-width / 2, h / 2, -width / 2, h / 2 - r); shape.lineTo(-width / 2, -h / 2 + r); shape.quadraticCurveTo(-width / 2, -h / 2, -width / 2 + r, -h / 2);
  const slab = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.06, bevelEnabled: false }), SHELL_DARK);
  slab.position.z = -0.065; grp.add(slab);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(width, h), new THREE.MeshBasicMaterial({ map: t, transparent: true, toneMapped: false }));
  grp.add(face);
  grp.userData.height = h;
  return cast(grp);
}

// A coin with the project logo on its face.
function coin(logoCanvas, rim) {
  const t = new THREE.CanvasTexture(logoCanvas); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const side = metal(rim, 0.3, 0.9);
  const face = new THREE.MeshStandardMaterial({ map: t, roughness: 0.45, metalness: 0.05 });
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.14, 64), [side, face, side]);
  m.rotation.x = Math.PI / 2; // face toward +z
  const g = new THREE.Group(); g.add(m);
  // Cylinder top-face UVs are rotated; turn the group so the logo reads upright.
  m.rotation.y = Math.PI / 2;
  return cast(g);
}
function logoFace(img, bg, scale = 0.72) {
  const c = document.createElement("canvas"); c.width = c.height = 512;
  const g = c.getContext("2d");
  g.fillStyle = bg; g.fillRect(0, 0, 512, 512);
  if (img) {
    const s = 512 * scale, k = Math.min(s / img.width, s / img.height);
    g.drawImage(img, (512 - img.width * k) / 2, (512 - img.height * k) / 2, img.width * k, img.height * k);
  }
  return c;
}
function siewsLogo() {
  // Same mark as the SIEWS+ navbar: amber gradient tile with "S+".
  const c = document.createElement("canvas"); c.width = c.height = 512;
  const g = c.getContext("2d");
  g.fillStyle = "#16151c"; g.fillRect(0, 0, 512, 512);
  const grd = g.createLinearGradient(130, 130, 382, 382); grd.addColorStop(0, "#fbbf24"); grd.addColorStop(1, "#d97706");
  g.fillStyle = grd; g.beginPath(); g.roundRect(136, 136, 240, 240, 56); g.fill();
  g.fillStyle = "#ffffff"; g.font = "900 118px system-ui, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("S+", 256, 262);
  return c;
}
function billboard(tex, height) {
  const a = tex.image.width / tex.image.height;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(height * a, height), new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.4, roughness: 0.9, side: THREE.DoubleSide }));
  m.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.4 });
  m.castShadow = true; m.position.y = height / 2;
  return m;
}
function shield(color) {
  const s = new THREE.Shape();
  s.moveTo(0, 0.62); s.quadraticCurveTo(0.32, 0.5, 0.55, 0.52); s.quadraticCurveTo(0.58, -0.2, 0, -0.66);
  s.quadraticCurveTo(-0.58, -0.2, -0.55, 0.52); s.quadraticCurveTo(-0.32, 0.5, 0, 0.62);
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.14, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 3, curveSegments: 16 });
  geo.center();
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.3 })));
  const white = metal(0xffffff, 0.3, 0.2);
  const shortArm = new THREE.Mesh(new RoundedBoxGeometry(0.1, 0.24, 0.06, 2, 0.03), white);
  shortArm.position.set(-0.1, -0.02, 0.13); shortArm.rotation.z = 0.75; g.add(shortArm);
  const longArm = new THREE.Mesh(new RoundedBoxGeometry(0.1, 0.46, 0.06, 2, 0.03), white);
  longArm.position.set(0.1, 0.06, 0.13); longArm.rotation.z = -0.6; g.add(longArm);
  return cast(g);
}
function view(pos, target) { camera.position.set(...pos); camera.lookAt(...target); }

// ---------- compositions ----------
const builds = {
  async jagapadi() {
    const [landing, mobile, logo] = await Promise.all([load("projects/jagapadi-landing.jpg"), load("projects/jagapadi-mobile.jpg"), load("projects/jagapadi-logo.png")]);
    const lap = laptop(landing); lap.position.set(-0.9, 0, 0); lap.rotation.y = 0.22; scene.add(lap);
    const ph = phone(mobile); ph.position.set(2.75, 1.24, 0.9); ph.rotation.set(-0.12, -0.38, 0); scene.add(ph);
    const c = coin(logoFace(logo.image, "#f6f1e7", 0.64), 0xc9a45c); c.position.set(-3.6, 2.9, 0.6); c.rotation.set(0.1, 0.42, -0.08); scene.add(c);
    view([1.4, 3.4, 11.2], [0.25, 1.2, 0]);
  },
  async helaloka() {
    const [landing, map, logo] = await Promise.all([load("projects/helaloka-landing.jpg"), load("projects/helaloka-map.jpg"), load("projects/helaloka-logo.png")]);
    const lap = laptop(landing); lap.rotation.y = 0.26; lap.position.x = -0.5; scene.add(lap);
    const win = windowPanel(map, 2.6, "HELALOKA · sebaran asap", true); win.position.set(2.3, 1.5, 1.0); win.rotation.y = -0.42; scene.add(win);
    const c = coin(logoFace(logo.image, "#1f2b26", 0.62), 0xd9c48a); c.position.set(-3.1, 3.0, 0.6); c.rotation.set(0.08, 0.45, -0.06); scene.add(c);
    view([1.0, 3.4, 11.6], [0.1, 1.4, 0]);
  },
  async narpati() {
    const [landing, play, logo] = await Promise.all([load("projects/narpati-landing.jpg"), load("projects/narpati-play.jpg"), load("projects/narpati-logo.png")]);
    const lap = laptop(landing); lap.rotation.y = -0.24; lap.position.x = 0.4; scene.add(lap);
    const win = windowPanel(play, 2.6, "Narpati Quest · Dalang AI", true); win.position.set(-2.35, 1.45, 1.0); win.rotation.y = 0.42; scene.add(win);
    const c = coin(logoFace(logo.image, "#17130d", 0.7), 0xc9a24a); c.position.set(3.0, 3.0, 0.6); c.rotation.set(0.08, -0.45, 0.06); scene.add(c);
    view([-1.0, 3.4, 11.6], [-0.1, 1.4, 0]);
  },
  async aromasys() {
    const [landing, logo] = await Promise.all([load("projects/aromasys-landing.jpg"), load("projects/aromasys-logo.png")]);
    const lap = laptop(landing); lap.rotation.y = -0.28; scene.add(lap);
    const c = coin(logoFace(logo.image, "#f3f6ec", 0.78), 0x5d8f2e); c.position.set(2.65, 2.75, 0.7); c.rotation.set(0.08, -0.5, 0.1); scene.add(c);
    view([-1.6, 3.5, 9.6], [0.3, 1.25, 0]);
  },
  async skyopt() {
    const [landing, eagle, wolf] = await Promise.all([load("projects/skyopt-landing.jpg"), load("projects/skyopt-eagle.png"), load("projects/skyopt-wolf.png")]);
    const lap = laptop(landing); lap.rotation.y = 0.18; scene.add(lap);
    const e = billboard(eagle, 1.15); e.position.set(-2.55, 2.75, 0.4); e.rotation.y = 0.3; scene.add(e);
    const w = billboard(wolf, 1.25); w.position.set(2.75, 0.62, 0.85); w.rotation.y = -0.35; scene.add(w);
    view([1.3, 3.4, 9.8], [0, 1.25, 0]);
  },
  async siews() {
    const [det] = await Promise.all([load("projects/siews-detect.jpg")]);
    const mon = monitor(det, det.image.width / det.image.height); mon.rotation.y = 0.24; scene.add(mon);
    const c = coin(siewsLogo(), 0xd97706); c.position.set(-2.75, 3.35, 0.6); c.rotation.set(0.08, 0.5, -0.06); scene.add(c);
    view([1.2, 3.6, 10.6], [0.2, 1.75, 0]);
  },
  async soc() {
    const [tg, wf] = await Promise.all([load("projects/soc-telegram.jpg"), load("projects/soc-workflow.png")]);
    const flow = windowPanel(wf, 3.6, "Shuffle · DDoS workflow", true); flow.position.set(-1.25, 2.55, -0.8); flow.rotation.set(0, 0.28, 0); scene.add(flow);
    const chat = windowPanel(tg, 2.2, "SOC-Bot · Telegram"); chat.position.set(1.45, 1.75, 0.6); chat.rotation.set(0, -0.3, 0); scene.add(chat);
    const sh = shield(0xe5534b); sh.position.set(-2.55, 0.85, 1.1); sh.rotation.set(0, 0.5, 0); sh.scale.setScalar(1.05); scene.add(sh);
    view([0.2, 2.9, 10.2], [0, 1.55, 0]);
  },
};

await builds[ID]();
renderer.render(scene, camera);
window.READY = true;
</script>
</body>
</html>
