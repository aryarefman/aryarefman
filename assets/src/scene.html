<!doctype html>
<!--
  3D scenes for the profile README, rendered frame by frame by render.py.
  Query: ?scene=hero|pillars|metrics|footer&theme=dark|light
  The page exposes window.renderAt(t) (seconds) and window.LOOP (seconds per seamless loop).
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet" />
<style>
  :root {
    --bg: #05050f; --bg2: #120d2a; --ink: #f4f1ff; --muted: #a9a3c9; --line: rgba(220, 210, 255, 0.16);
    --see: #ffb454; --defend: #ff6b6b; --decide: #8b9cff;
  }
  :root[data-theme="light"] {
    --bg: #f5f0e8; --bg2: #ebe3d6; --ink: #1d1926; --muted: #6b6276; --line: rgba(29, 25, 38, 0.12);
    --see: #c97a10; --defend: #d9473f; --decide: #4f5fe0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(40% 55% at 78% 30%, rgba(124, 77, 255, 0.28) 0%, transparent 70%),
      radial-gradient(35% 50% at 62% 85%, rgba(0, 170, 190, 0.18) 0%, transparent 70%),
      radial-gradient(30% 45% at 12% 15%, rgba(255, 92, 170, 0.12) 0%, transparent 70%),
      radial-gradient(120% 140% at 70% 45%, #120d2a 0%, #05050f 65%);
    color: var(--ink); font-family: "Bricolage Grotesque", system-ui, sans-serif;
  }
  #stage { position: absolute; inset: 0; }
  canvas { display: block; width: 100% !important; height: 100% !important; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .frame { position: absolute; inset: 14px; border: 1px solid var(--line); border-radius: 18px; }

  /* hero */
  .hero-copy { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 600px; }
  .hello { font-size: 17px; color: var(--muted); letter-spacing: 0.04em; }
  .hello b { color: var(--see); font-weight: 600; }
  .name { font-size: 64px; line-height: 0.98; font-weight: 800; letter-spacing: -0.03em; margin: 14px 0 18px; }
  .role { font-size: 21px; line-height: 1.4; color: var(--muted); font-weight: 500; max-width: 520px; }
  .role em { font-style: normal; color: var(--ink); }
  .chips { display: flex; gap: 10px; margin-top: 26px; }
  .chip { white-space: nowrap; font-size: 13px; font-weight: 600; padding: 8px 14px 8px 12px; border-radius: 999px; border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; letter-spacing: 0.02em; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; display: block; }
  .now { margin-top: 22px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .now b { color: var(--ink); font-weight: 600; }
  .now .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fbf7f; box-shadow: 0 0 0 4px rgba(63, 191, 127, 0.18); }
  .corner { position: absolute; right: 40px; bottom: 32px; font-size: 11px; letter-spacing: 0.18em; color: var(--muted); opacity: 0.8; }

  /* metrics */
  .metric { position: absolute; bottom: 38px; width: 20%; text-align: center; }
  .metric .val { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; }
  .metric .lab { font-size: 14px; color: var(--muted); font-weight: 500; line-height: 1.35; margin-top: 4px; }
  .metric .src { font-size: 11px; letter-spacing: 0.14em; margin-top: 8px; }
  .season { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; padding: 6px 12px; border-radius: 12px; background: rgba(8, 8, 26, 0.55); border: 1px solid var(--line); }
  .season b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .season span { display: block; margin-top: 4px; font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: 0.02em; color: var(--muted); }
  .heading { position: absolute; left: 0; right: 0; top: 34px; text-align: center; font-size: 13px; letter-spacing: 0.3em; color: var(--muted); }

  /* pillars */
  .pillar { position: absolute; bottom: 44px; width: 33.33%; text-align: center; }
  .pillar .num { font-size: 14px; letter-spacing: 0.16em; }
  .pillar .title { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 4px; }
  .pillar .sub { font-size: 16px; color: var(--muted); font-weight: 500; }

  /* footer */
  .foot-copy { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); }
  .foot-copy .big { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }
  .foot-copy .small { font-size: 16px; color: var(--muted); margin-top: 10px; }
  .foot-copy .small b { color: var(--decide); font-weight: 600; }
  .foot-copy .links { font-size: 13px; color: var(--muted); margin-top: 22px; letter-spacing: 0.06em; }
  .foot-me { position: absolute; bottom: 28px; left: 650px; height: 356px; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.3)); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="overlay" id="overlay"></div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { createWorld } from "./world.js";
import { createSky } from "./sky.js";

const params = new URLSearchParams(location.search);
const SCENE = params.get("scene") || "hero";
const THEME = params.get("theme") || "dark";
document.documentElement.dataset.theme = THEME;
const DARK = THEME === "dark";


// ---------- overlay copy ----------
const overlays = {
  hero: `
    <div class="frame"></div>
    <div class="hero-copy">
      <div class="hello mono">// hello world, I'm <b>Arya</b></div>
      <div class="name">Arya Bisma<br/>Putra Refman</div>
      <div class="role">IT student at <em>ITS Surabaya</em>, building systems that <em>see</em>, <em>defend</em> and <em>decide</em>.</div>
      <div class="chips mono">
        <span class="chip"><i style="background:var(--see)"></i>Computer Vision</span>
        <span class="chip"><i style="background:var(--defend)"></i>Cyber Defense</span>
        <span class="chip"><i style="background:var(--decide)"></i>Distributed Systems</span>
      </div>
      <div class="now mono"><span class="dot"></span>now building <b>Jagapadi</b> · UM Metro Hackathon 2026</div>
    </div>
    <div class="corner mono">SURABAYA, ID · 7.28° S 112.79° E</div>`,
  pillars: `
    <div class="frame"></div>
    <div class="pillar" style="left:0"><div class="num mono" style="color:var(--see)">01 / SEE</div><div class="title">Perception</div><div class="sub">YOLOv8 · OpenCV · satellite imagery</div></div>
    <div class="pillar" style="left:33.33%"><div class="num mono" style="color:var(--defend)">02 / DEFEND</div><div class="title">Security</div><div class="sub">Wazuh SIEM · SOAR · forensics</div></div>
    <div class="pillar" style="left:66.66%"><div class="num mono" style="color:var(--decide)">03 / DECIDE</div><div class="title">Systems</div><div class="sub">gRPC · FastAPI · cloud scheduling</div></div>`,
  footer: `
    <div class="frame"></div>
    <div class="foot-copy">
      <div class="big">Thanks for stopping by.</div>
      <div class="small mono">Open to collaboration, research and hackathons.</div>
      <div class="small mono"><b>Let's build something.</b></div>
      <div class="links mono">linkedin.com/in/aryarefman · arya445refman@gmail.com</div>
    </div>
    <img class="foot-me" src="me-waterfall.png" alt="" />`,
  seasons: `
    <div class="frame"></div>
    <div class="heading mono">MAP OF MY WORK · ONE ISLAND PER KIND OF PROJECT</div>
    <div class="season" data-i="0"><b style="color:#ff94c2">Learning tools</b><span>AlgoVerse 🥈 · Sky Optimizers</span></div>
    <div class="season" data-i="1"><b style="color:#ffd27a">Hackathon builds</b><span>Jagapadi · HELALOKA · SIEWS+ 🏅</span></div>
    <div class="season" data-i="2"><b style="color:#ff8a3d">Products</b><span>AromaSys 🥈 · Narpati Quest</span></div>
    <div class="season" data-i="3"><b style="color:#bfe6ff">Security &amp; research</b><span>SOC-SOAR · LLM guardrails · SLR</span></div>`,
  metrics: `
    <div class="frame"></div>
    <div class="heading mono">BY THE NUMBERS</div>
    <div class="metric" style="left:0"><div class="val" style="color:var(--defend)">15.7M</div><div class="lab">SYN-flood packets<br/>absorbed and blocked</div><div class="src mono" style="color:var(--defend)">SOC-SOAR</div></div>
    <div class="metric" style="left:20%"><div class="val" style="color:var(--defend)">&lt; 4 s</div><div class="lab">from detection to block,<br/>no human in the loop</div><div class="src mono" style="color:var(--defend)">SOC-SOAR</div></div>
    <div class="metric" style="left:40%"><div class="val" style="color:var(--see)">&lt; 50 ms</div><div class="lab">per frame to check<br/>red-zone breaches</div><div class="src mono" style="color:var(--see)">SIEWS+</div></div>
    <div class="metric" style="left:60%"><div class="val" style="color:var(--decide)">~15%</div><div class="lab">lower makespan than<br/>FCFS and Round Robin</div><div class="src mono" style="color:var(--decide)">PEFT SCHEDULER</div></div>
    <div class="metric" style="left:80%"><div class="val" style="color:var(--decide)">2,812</div><div class="lab">papers screened for<br/>the world-model review</div><div class="src mono" style="color:var(--decide)">SLR</div></div>`,
};
document.getElementById("overlay").innerHTML = overlays[SCENE];

// ---------- renderer ----------
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = DARK ? 1.05 : 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);

// Every README image shares the same deep-space backdrop (sky.js stage 0).
const LAYER = parseFloat(params.get("layer") ?? "0");
const skyCanvas = document.createElement("canvas");
skyCanvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;z-index:-1";
document.body.prepend(skyCanvas);
createSky(skyCanvas, { reduceMotion: true }).draw(0, LAYER, 0, 0);

const world = createWorld({ name: SCENE, scene, camera, width: W, height: H, dark: DARK, drift: true, stars3d: false });
window.LOOP = world.loop;

// seasons map: put each label beside its island (anchors come from the world, projected at the rest pose)
if (SCENE === "seasons") {
  world.update(0);
  camera.updateMatrixWorld();
  camera.userData.anchors.forEach((v, i) => {
    const el = document.querySelector(`.season[data-i="${i}"]`), q = v.clone().project(camera);
    el.style.left = `${((q.x + 1) / 2) * W}px`;
    el.style.top = `${((1 - q.y) / 2) * H}px`;
  });
}
window.renderAt = (t) => {
  const p = ((t % world.loop) + world.loop) % world.loop / world.loop;
  world.update(p);
  // HTML layers sway with the camera too (data-depth = pixels at full swing; negative = in front)
  document.querySelectorAll("[data-depth]").forEach((el) => {
    el.style.transform = `translateX(${(parseFloat(el.dataset.depth) * Math.sin(Math.PI * 2 * p)).toFixed(2)}px)`;
  });
  renderer.render(scene, camera);
  return true;
};
await document.fonts.ready;
await Promise.all([...document.images].map((img) => img.decode()));
window.renderAt(0);
window.READY = true;
</script>
</body>
</html>
